[project]
name = "nano-rl"
version = "0.1.0"
description = "nano-rl"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "torch>=2.9.0",
    "transformers",

    # Data loading
    "datasets>=4.0.0",
    "torchdata>=0.11.0",           # StatefulDataLoader

    # Logging & monitoring
    "loguru>=0.7.3",

    # Config & validation
    "pydantic>=1.10.13",
    "pydantic-settings>=2.10.1",
    "tomli>=2.2.1",
    "tomli-w>=1.0.0",

    # Type checking
    "beartype>=0.21.0",
    "jaxtyping>=0.3.2",

    # Optional
    "liger-kernel>=0.5.10",        # Efficient cross entropy loss

    "uvloop>=0.21.0",
    "vllm",

    "openai>=1.106.1",
    "verifiers",
    "reverse-text>=0.1.4",
    # Formatting tables
    "rich>=14.0.0",
]

[project.scripts]
sft = "nano_rl.trainer.sft.train:main"
inference = "nano_rl.inference.server:main"
orchestrator = "nano_rl.orchestrator.orchestrator:main"
rl-train = "nano_rl.trainer.rl.train:main"
rl = "nano_rl.rl:main"

[project.optional-dependencies]
flash-attn = [
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.6.3%2Bcu128torch2.10-cp312-cp312-linux_x86_64.whl",
]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
prerelease = "allow"
no-build-isolation-package = ["flash-attn"]
override-dependencies = [
    "transformers>=5.1.0.dev0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
reverse-text = { index = "primeintellect" }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "9052ecf" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "609e3d5" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.16.0/vllm-0.16.0-cp38-abi3-manylinux_2_31_x86_64.whl" }


[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "primeintellect"
url = "https://hub.primeintellect.ai/primeintellect/simple/"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests as gpu",
]
