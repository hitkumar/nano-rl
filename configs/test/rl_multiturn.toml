# Minimal config for multi-turn RL integration testing
# Uses 2 GPUs: 1 inference, 1 trainer

run_id = "test_rl_multiturn"
max_steps = 3
seq_len = 2048
max_async_level = 1
clean = true

inference_gpu_ids = [0]
trainer_gpu_ids = [1]

[model]
name = "Qwen/Qwen3-0.6B"

[weight_broadcast]
type = "nccl"

[trainer]
broadcast_interval = 1

[orchestrator]
batch_size = 16
rollouts_per_example = 8

[orchestrator.sampling]
max_tokens = 384

[[orchestrator.env]]
id = "primeintellect/alphabet-sort"
args = { min_turns = 2, max_turns = 2, min_names_per_turn = 1, max_names_per_turn = 2, similarity_power = 4, power_per_turn = false }

[inference]
gpu_memory_utilization = 0.9

[inference.model]
max_model_len = 2048
enforce_eager = true
