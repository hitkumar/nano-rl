# Alphabet Sort: multi-turn RL example
# Usage: uv run rl @ configs/examples/alphabet_sort/rl.toml

output_dir = "outputs/alphabet_sort_rl"
max_steps = 100
seq_len = 4096
max_async_level = 1
clean = true

# GPU allocation (8 GPUs: 4 inference, 4 training)
inference_gpu_ids = [0, 1, 2, 3]
trainer_gpu_ids = [4, 5, 6, 7]

[model]
name = "Qwen/Qwen3-0.6B"

[weight_broadcast]
type = "nccl"

[ckpt]
interval = 20

[trainer]
broadcast_interval = 1

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 8
rollouts_per_example = 8

[orchestrator.sampling]
max_tokens = 768

[[orchestrator.env]]
id = "primeintellect/alphabet-sort"
args = { min_turns = 3, max_turns = 3 }

[inference]
gpu_memory_utilization = 0.95

[inference.model]
max_model_len = 4096
enforce_eager = false
